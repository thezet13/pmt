[phases.setup]
nixPkgs = [
  "php82",
  "php82Packages.composer",
  "nodejs_20",
  "npm",
  "chromium"
]

aptPkgs = [
  "ca-certificates",
  "git",
  "libzip-dev",
  "unzip",
  "zip",
  "fontconfig",
  "libnss3",
  "libatk-bridge2.0-0",
  "libgtk-3-0",
  "libxss1",
  "libasound2"
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm ci"
]

[phases.build]
cmds = [
  "npm run build",
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

[start]
cmd = "php artisan optimize:clear && php artisan migrate --force && php artisan storage:link || true && mkdir -p storage/app/pptx/tmp storage/app/pptx/exports storage/app/charts storage/app/private/charts && chmod -R 777 storage bootstrap/cache && php artisan serve --host=0.0.0.0 --port=$PORT"
